# Loaded via ANSIBLE_CONFIG (set in the Dockerfile), so it applies from any
# working directory.
[defaults]
# Inventory lives in the private homelab-base-configs repo, bind-mounted by compose.
inventory           = /home/ansible/config/hosts
host_key_checking   = True
interpreter_python  = auto_silent
result_format       = yaml

[privilege_escalation]
# Always prompt for the sudo password: nothing stored on disk, no -K to remember.
become_ask_pass = True

[ssh_connection]
# Not a default: it removes one SSH round trip per task. Safe here because Ubuntu
# ships sudo without `requiretty`.
pipelining = True
